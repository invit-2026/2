
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation Card</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#fce3ec,#e3f2fd);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
background:white;
max-width:650px;
width:90%;
padding:40px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,0.1);
text-align:center;
}

h1{
color:#e91e63;
font-size:38px;
margin-bottom:10px;
}

h2{
font-size:22px;
font-weight:500;
margin-bottom:20px;
color:#333;
}

.info{
font-size:18px;
margin:8px 0;
}

.highlight{
color:#1976d2;
font-weight:600;
}

.map{
margin-top:25px;
border-radius:20px;
overflow:hidden;
}

.btn{
display:inline-block;
margin-top:20px;
padding:12px 28px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:50px;
font-weight:600;
}

.btn:hover{
opacity:0.9;
}
</style>
</head>

<body>

<div class="card">

<h1>🎉 You're Invited 🎉</h1>

<h2>Mane 30th Birthday & Amelie First Tooth Party</h2>

<p class="info">📅 Date: <span class="highlight">20.06.2026</span></p>
<p class="info">⏰ Time: <span class="highlight">19:00</span></p>
<p class="info">📍 Venue: <span class="highlight">Florence Restaurant</span></p>

<a class="btn" href="https://wa.me/" target="_blank">
RSVP on WhatsApp
</a>

<div class="map">

<iframe
width="100%"
height="280"
style="border:0"
loading="lazy"
allowfullscreen
referrerpolicy="no-referrer-when-downgrade"
src="https://www.google.com/maps?q=Florence%20Restaurant&output=embed">
</iframe>

</div>

</div>

</body>
</html>
